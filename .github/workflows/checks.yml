name: Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      linux: ${{ steps.summary.outputs.ubuntu-latest }}
      macos: ${{ steps.summary.outputs.macos-latest }}
      windows: ${{ steps.summary.outputs.windows-latest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        id: formatting
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Lint
        id: linting
        continue-on-error: true
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        id: testing
        continue-on-error: true
        run: cargo test --locked --all-features
      - name: Collect results
        id: summary
        if: always()
        run: |
          echo '${{ matrix.os }}=| ${{ runner.os }} | ${{ steps.testing.outcome == 'success' && '✅' || '❌' }} | ${{ matrix.os != 'ubuntu-latest' && '➖' || (steps.formatting.outcome == 'success' && '✅' || '❌') }} | ${{ steps.linting.outcome == 'success' && '✅' || '❌' }} |' >> "$GITHUB_OUTPUT"
      - name: Fail unsuccessful checks
        if: >-
          always() &&
          ((matrix.os == 'ubuntu-latest' && steps.formatting.outcome != 'success') ||
           steps.linting.outcome != 'success' ||
           steps.testing.outcome != 'success')
        run: exit 1

  summary:
    name: Checks summary
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write summary
        env:
          LINUX: ${{ needs.checks.outputs.linux || '| Linux | ❌ | ❌ | ❌ |' }}
          MACOS: ${{ needs.checks.outputs.macos || '| macOS | ❌ | ➖ | ❌ |' }}
          WINDOWS: ${{ needs.checks.outputs.windows || '| Windows | ❌ | ➖ | ❌ |' }}
        run: |
          {
            echo '### Checks'
            echo
            echo '| OS | Test | Format | Lint |'
            echo '| --- | :---: | :---: | :---: |'
            printf '%s\n' "$LINUX" "$MACOS" "$WINDOWS"
            echo
            echo '✅ Passed · ❌ Failed or did not complete · ➖ Not run on this OS'
          } >> "$GITHUB_STEP_SUMMARY"
